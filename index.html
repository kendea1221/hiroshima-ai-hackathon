<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUGEN DREAMS | Vercel Edition Dream Engine</title>

  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            vercel: {
              black: '#000000',
              dark: '#0a0a0a',
              card: '#111111',
              border: '#222222',
              hoverBorder: '#444444',
              gray: '#888888',
              lightGray: '#ececec'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #000000;
      color: #ededed;
    }

    /* Vercel Ambient Glow Effect */
    .vercel-glow {
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
    }

    .vercel-card {
      background-color: #0a0a0a;
      border: 1px solid #222222;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .vercel-card:hover {
      border-color: #444444;
    }

    .card-container {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
    }
    .card-shine {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.15) 0%,
        rgba(255, 255, 255, 0) 60%
      );
    }

    canvas {
      image-rendering: pixelated;
    }

    /* Custom scrollbar for Vercel dark theme */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #222222;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444444;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans vercel-glow selection:bg-white selection:text-black">

  <header class="border-b border-neutral-800 bg-black/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Vercel-like Triangle Icon -->
        <div class="w-6 h-6 bg-white flex items-center justify-center [clip-path:polygon(50%_0%,_0%_100%,_100%_100%)]"></div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold tracking-tight text-white font-mono">MUGEN DREAMS</span>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-neutral-900 text-neutral-400 border border-neutral-800">ver.2.5</span>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button id="reset-db-btn" class="px-3 py-1.5 text-xs font-mono text-neutral-400 hover:text-white hover:bg-neutral-900 rounded-md border border-neutral-800 transition flex items-center gap-1.5">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          RESET DB
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Generator & Preview -->
    <section class="lg:col-span-5 flex flex-col gap-6">
      
      <!-- Input Box -->
      <div class="vercel-card rounded-xl p-5 border border-neutral-800">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-mono font-semibold tracking-wider text-neutral-400 uppercase flex items-center gap-2">
            <i data-lucide="terminal" class="w-3.5 h-3.5 text-white"></i>
            PROMPT / DREAM INPUT
          </h2>
          <span class="text-[10px] font-mono text-neutral-600">AI-SYMMETRY-ENGINE</span>
        </div>

        <form id="dream-form" class="flex flex-col gap-3">
          <textarea id="dream-input" rows="3" 
            class="w-full bg-black border border-neutral-800 rounded-lg p-3 text-xs text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-neutral-500 font-mono resize-none transition"
            placeholder="夢の内容を入力...（例: 漆黒の暗闇の中で燃え上がる紅蓮の魔神と遭遇した）"></textarea>

          <!-- Quick presets -->
          <div>
            <span class="text-[11px] text-neutral-500 font-mono block mb-1.5">PRESETS:</span>
            <div class="flex flex-wrap gap-1.5">
              <button type="button" class="sample-btn text-[11px] font-mono px-2.5 py-1 rounded-md bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 transition" data-text="紅蓮の炎を身に纏う伝説の魔神">
                🔥 紅蓮の魔神
              </button>
              <button type="button" class="sample-btn text-[11px] font-mono px-2.5 py-1 rounded-md bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 transition" data-text="宮島の大きな鳥居が海の上を飛び回る夢">
                ⛩️ 宮島鳥居
              </button>
              <button type="button" class="sample-btn text-[11px] font-mono px-2.5 py-1 rounded-md bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 transition" data-text="天空を優雅に舞う巨大な黄金のクジラ">
                🐋 黄金クジラ
              </button>
            </div>
          </div>

          <button type="submit" id="generate-btn" 
            class="w-full mt-1 py-2.5 px-4 rounded-md bg-white hover:bg-neutral-200 text-black font-mono font-bold text-xs transition flex items-center justify-center gap-2">
            <i data-lucide="cpu" class="w-4 h-4"></i>
            GENERATE CARD
          </button>
        </form>
      </div>

      <!-- Live Active Card Display -->
      <div id="active-card-wrapper" class="vercel-card rounded-xl p-6 border border-neutral-800 flex flex-col items-center justify-center min-h-[440px] relative">
        
        <div id="card-placeholder" class="text-center p-6">
          <div class="w-12 h-12 rounded-lg bg-neutral-900 border border-neutral-800 flex items-center justify-center mx-auto mb-3 text-neutral-500">
            <i data-lucide="box" class="w-6 h-6"></i>
          </div>
          <p class="text-xs font-mono text-neutral-500">夢を入力してカードを生成するか<br>右側の図鑑からカードを選択してください</p>
        </div>

        <div id="card-render-container" class="hidden w-full flex flex-col items-center">
          
          <!-- Exact Trading Card Template (Matching user provided image) -->
          <div class="card-container w-full max-w-[280px]">
            <div id="3d-card" class="card-inner relative w-full rounded-lg overflow-hidden border-2 bg-black p-3 flex flex-col gap-2.5 shadow-2xl transition-all" style="border-color: #7f1d1d;">
              <div class="card-shine absolute inset-0 pointer-events-none z-10"></div>
              
              <!-- Card Header -->
              <div class="flex items-center gap-2 z-20">
                <div id="card-rarity-bg" class="w-8 h-7 bg-blue-600 flex items-center justify-center font-mono font-black text-xs text-white rounded-xs shadow">
                  <span id="card-rarity">N</span>
                </div>
                <h3 id="card-title" class="text-sm font-bold text-white tracking-tight truncate flex-1 font-sans">
                  紅蓮の魔神
                </h3>
              </div>

              <!-- Pixel Art Display Screen -->
              <div class="relative w-full aspect-square rounded border border-neutral-900 bg-[#050508] p-3 flex items-center justify-center overflow-hidden">
                <canvas id="main-card-canvas" width="256" height="256" class="w-full h-full object-contain"></canvas>
                
                <!-- Element Emoji Icon Overlay (Top Right) -->
                <div class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 border border-neutral-800 backdrop-blur-sm flex items-center justify-center text-sm" id="card-element-icon">
                  🔥
                </div>
              </div>

              <!-- Stats Block (ATK / DEF) -->
              <div class="z-20 bg-[#080810] border border-neutral-900 rounded p-2 flex justify-between items-center font-mono text-xs">
                <div class="flex items-center gap-1.5">
                  <span class="text-red-500 font-bold">ATK</span>
                  <span class="text-neutral-500">/</span>
                  <span id="card-atk" class="text-neutral-200 font-semibold">2800</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="text-blue-500 font-bold">DEF</span>
                  <span class="text-neutral-500">/</span>
                  <span id="card-def" class="text-neutral-200 font-semibold">3700</span>
                </div>
              </div>

              <!-- Card Footer Meta -->
              <div class="z-20 text-center pt-1 border-t border-neutral-900">
                <p id="card-element-text" class="text-[10px] font-mono text-neutral-500 tracking-wider uppercase">
                  ELEMENT: 火 | AI DREAM CARD
                </p>
              </div>

            </div>
          </div>

          <!-- Actions -->
          <div class="mt-4 flex gap-2 w-full max-w-[280px]">
            <button id="download-card-btn" class="w-full py-2 px-3 rounded-md bg-neutral-900 hover:bg-neutral-800 text-xs font-mono text-neutral-300 border border-neutral-800 transition flex items-center justify-center gap-1.5">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              DOWNLOAD PNG
            </button>
          </div>

        </div>

      </div>

    </section>

    <!-- Right Column: Collection Grid -->
    <section class="lg:col-span-7 flex flex-col gap-4">
      
      <!-- Control Bar -->
      <div class="vercel-card rounded-xl p-4 border border-neutral-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-xs font-mono font-semibold text-neutral-400 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="database" class="w-3.5 h-3.5 text-white"></i>
            DREAM COLLECTION (<span id="collection-count" class="text-white font-bold">0</span>)
          </h2>
        </div>

        <div class="flex items-center gap-2">
          <input type="text" id="search-input" placeholder="SEARCH..." 
            class="bg-black border border-neutral-800 rounded-md px-2.5 py-1 text-xs text-neutral-200 font-mono placeholder-neutral-600 focus:outline-none focus:border-neutral-600 w-28 sm:w-36">
          
          <select id="rarity-filter" class="bg-black border border-neutral-800 rounded-md px-2 py-1 text-xs text-neutral-300 font-mono focus:outline-none">
            <option value="ALL">ALL</option>
            <option value="UR">UR</option>
            <option value="SSR">SSR</option>
            <option value="SR">SR</option>
            <option value="N">N</option>
          </select>
        </div>
      </div>

      <!-- Collection Grid -->
      <div id="collection-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-[640px] overflow-y-auto pr-1">
        <!-- Collection items dynamic generation -->
      </div>

    </section>

  </main>

  <footer class="border-t border-neutral-800 py-6 bg-black mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-[11px] text-neutral-600 font-mono">
        MUGEN DREAMS ENGINE &copy; 2026 BY MUGEN RAY. BUILT WITH VERCEL DESIGN SYSTEM.
      </p>
    </div>
  </footer>

  <script>
    // Default Cards with Image-matching Symmetric Monster Data
    const DEFAULT_CARDS = [
      { id: "MUGEN-001", title: "紅蓮の魔神", rarity: "N", element: "火", icon: "🔥", atk: 2800, def: 3700, borderColor: "#7f1d1d", text: "紅蓮の炎を身に纏う伝説の魔神" },
      { id: "MUGEN-002", title: "宮島鳥居の守護龍", rarity: "UR", element: "光", icon: "🌟", atk: 4500, def: 4200, borderColor: "#ca8a04", text: "宮島の大きな鳥居が海の上を飛び回る夢" },
      { id: "MUGEN-003", title: "天空の黄金クジラ", rarity: "SSR", element: "風", icon: "⚡", atk: 3800, def: 3100, borderColor: "#9333ea", text: "天空を優雅に舞う巨大な黄金のクジラ" },
      { id: "MUGEN-004", title: "深海のサイバー機兵", rarity: "SR", element: "水", icon: "🌊", atk: 2200, def: 2900, borderColor: "#2563eb", text: "ネオン輝く深海都市の守護メカニック" },
      { id: "MUGEN-005", title: "古代樹の巨神ゴーレム", rarity: "SR", element: "木", icon: "🌿", atk: 1900, def: 4800, borderColor: "#16a34a", text: "千年の時を経て目覚めた巨大な木の巨人" },
      { id: "MUGEN-006", title: "漆黒のシャドウ", rarity: "N", element: "闇", icon: "💀", atk: 1500, def: 1200, borderColor: "#333333", text: "闇夜から突如として現れた謎の影" }
    ];

    let myCards = [];

    // Web Audio Generator
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'summon') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'fanfare') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        }
      } catch(e) {}
    }

    // Hash Helper
    function getHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    /**
     * Exact Symmetrical Pixel Monster Renderer (as seen in user image)
     */
    function renderSymmetricalPixelArt(canvas, text, element) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const hash = getHash(text);

      ctx.clearRect(0, 0, w, h);

      // Dark background
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, w, h);

      const gridSize = 12; // 12x12 grid for clean retro pixel art
      const pSize = Math.floor(w / gridSize);
      const halfGrid = Math.ceil(gridSize / 2);

      // Palette selection based on element / hash
      let mainColor = '#ef4444'; // Red
      let subColor = '#f97316';  // Orange
      let accentColor = '#ffffff'; // White
      let darkColor = '#1e293b'; // Dark Navy

      if (element === '水') {
        mainColor = '#3b82f6'; subColor = '#06b6d4';
      } else if (element === '木') {
        mainColor = '#22c55e'; subColor = '#84cc16';
      } else if (element === '光') {
        mainColor = '#eab308'; subColor = '#facc15';
      } else if (element === '闇') {
        mainColor = '#a855f7'; subColor = '#6b21a8';
      }

      // Generate half grid and reflect horizontally
      for (let y = 1; y < gridSize - 1; y++) {
        for (let x = 1; x <= halfGrid; x++) {
          const val = (hash * (x + 1) + y * 17) % 100;
          
          let fill = null;
          if (val > 35 && val < 65) {
            fill = mainColor;
          } else if (val >= 65 && val < 82) {
            fill = accentColor;
          } else if (val >= 82 && val < 94) {
            fill = subColor;
          } else if (val >= 94) {
            fill = darkColor;
          }

          if (fill) {
            // Draw left side
            ctx.fillStyle = fill;
            ctx.fillRect(x * pSize, y * pSize, pSize, pSize);

            // Mirror right side
            const mirroredX = (gridSize - 1) - x;
            ctx.fillRect(mirroredX * pSize, y * pSize, pSize, pSize);
          }
        }
      }

      // Add guaranteed central head/core feature
      const eyeColor = '#0f172a';
      ctx.fillStyle = accentColor;
      ctx.fillRect((halfGrid - 1) * pSize, 2 * pSize, pSize * 2, pSize * 2);
      ctx.fillStyle = eyeColor;
      ctx.fillRect((halfGrid - 1) * pSize + 4, 3 * pSize, 6, 6);
      ctx.fillRect((halfGrid) * pSize + 2, 3 * pSize, 6, 6);
    }

    // Initialize Storage
    function initStorage() {
      const stored = localStorage.getItem('mugen_vercel_collection');
      if (!stored || JSON.parse(stored).length === 0) {
        myCards = [...DEFAULT_CARDS];
        localStorage.setItem('mugen_vercel_collection', JSON.stringify(myCards));
      } else {
        myCards = JSON.parse(stored);
      }
    }

    function renderCollection() {
      const grid = document.getElementById('collection-grid');
      const search = document.getElementById('search-input').value.toLowerCase();
      const rarityVal = document.getElementById('rarity-filter').value;

      grid.innerHTML = '';

      const filtered = myCards.filter(c => {
        const matchText = c.title.toLowerCase().includes(search) || c.text.toLowerCase().includes(search);
        const matchRarity = rarityVal === 'ALL' || c.rarity === rarityVal;
        return matchText && matchRarity;
      });

      document.getElementById('collection-count').innerText = myCards.length;

      filtered.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = `vercel-card p-2 rounded-lg border border-neutral-800 hover:border-neutral-500 cursor-pointer flex flex-col justify-between group transition`;
        
        cardEl.innerHTML = `
          <div class="relative w-full aspect-square rounded bg-black border border-neutral-900 mb-2 overflow-hidden flex items-center justify-center">
            <canvas id="thumb-${card.id}" width="128" height="128" class="w-full h-full object-contain"></canvas>
            <span class="absolute top-1 left-1 text-[9px] font-mono font-bold px-1 py-0.2 rounded bg-blue-600 text-white">
              ${card.rarity}
            </span>
            <span class="absolute top-1 right-1 text-xs">
              ${card.icon}
            </span>
          </div>
          <div>
            <h4 class="text-xs font-bold text-white truncate font-sans">${card.title}</h4>
            <div class="flex justify-between items-center text-[10px] font-mono text-neutral-500 mt-1">
              <span>ATK/${card.atk}</span>
              <span>DEF/${card.def}</span>
            </div>
          </div>
        `;

        cardEl.addEventListener('click', () => selectCard(card));
        grid.appendChild(cardEl);

        setTimeout(() => {
          const canvas = document.getElementById(`thumb-${card.id}`);
          if (canvas) renderSymmetricalPixelArt(canvas, card.text, card.element);
        }, 0);
      });
    }

    function selectCard(card) {
      document.getElementById('card-placeholder').classList.add('hidden');
      document.getElementById('card-render-container').classList.remove('hidden');

      document.getElementById('card-title').innerText = card.title;
      document.getElementById('card-rarity').innerText = card.rarity;
      document.getElementById('card-element-icon').innerText = card.icon;
      document.getElementById('card-atk').innerText = card.atk;
      document.getElementById('card-def').innerText = card.def;
      document.getElementById('card-element-text').innerText = `ELEMENT: ${card.element} | AI DREAM CARD`;

      // Set rarity badge color
      const rarityBg = document.getElementById('card-rarity-bg');
      if (card.rarity === 'UR') rarityBg.className = 'w-8 h-7 bg-yellow-500 text-black font-mono font-black text-xs flex items-center justify-center rounded-xs shadow';
      else if (card.rarity === 'SSR') rarityBg.className = 'w-8 h-7 bg-purple-600 text-white font-mono font-black text-xs flex items-center justify-center rounded-xs shadow';
      else if (card.rarity === 'SR') rarityBg.className = 'w-8 h-7 bg-indigo-600 text-white font-mono font-black text-xs flex items-center justify-center rounded-xs shadow';
      else rarityBg.className = 'w-8 h-7 bg-blue-600 text-white font-mono font-black text-xs flex items-center justify-center rounded-xs shadow';

      // Set card frame border color
      const card3D = document.getElementById('3d-card');
      card3D.style.borderColor = card.borderColor || '#222222';

      const canvas = document.getElementById('main-card-canvas');
      renderSymmetricalPixelArt(canvas, card.text, card.element);
    }

    document.getElementById('dream-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('dream-input').value.trim();
      if (!input) return;

      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> GENERATING...`;
      playSound('summon');

      setTimeout(() => {
        const hash = getHash(input);
        let element = '火';
        let icon = '🔥';
        let borderColor = '#7f1d1d';
        let rarity = 'N';

        if (input.includes('海') || input.includes('水') || input.includes('深海')) {
          element = '水'; icon = '🌊'; borderColor = '#1e3a8a';
        } else if (input.includes('鳥居') || input.includes('光') || input.includes('宮島')) {
          element = '光'; icon = '🌟'; borderColor = '#854d0e'; rarity = 'UR';
        } else if (input.includes('クジラ') || input.includes('空') || input.includes('風')) {
          element = '風'; icon = '⚡'; borderColor = '#581c87'; rarity = 'SSR';
        }

        if (rarity === 'N' && hash % 3 === 0) rarity = 'SR';

        const newCard = {
          id: `MUGEN-${String(myCards.length + 1).padStart(3, '0')}`,
          title: input.slice(0, 8) + (input.length > 8 ? '...' : ''),
          rarity: rarity,
          element: element,
          icon: icon,
          atk: 1000 + (hash % 38) * 100,
          def: 1200 + ((hash * 3) % 35) * 100,
          borderColor: borderColor,
          text: input
        };

        myCards.unshift(newCard);
        localStorage.setItem('mugen_vercel_collection', JSON.stringify(myCards));

        document.getElementById('dream-input').value = '';
        selectCard(newCard);
        renderCollection();

        if ((rarity === 'UR' || rarity === 'SSR') && typeof confetti === 'function') {
          confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });
          playSound('fanfare');
        }

        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="cpu" class="w-4 h-4"></i> GENERATE CARD`;
        lucide.createIcons();
      }, 600);
    });

    // Reset Database
    document.getElementById('reset-db-btn').addEventListener('click', () => {
      if (confirm('図鑑データをリセットしますか？')) {
        localStorage.removeItem('mugen_vercel_collection');
        initStorage();
        renderCollection();
        if (myCards.length > 0) selectCard(myCards[0]);
      }
    });

    // Download PNG
    document.getElementById('download-card-btn').addEventListener('click', () => {
      const canvas = document.getElementById('main-card-canvas');
      const image = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = image;
      link.download = `CARD-${Date.now()}.png`;
      link.click();
    });

    // Sample buttons
    document.querySelectorAll('.sample-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('dream-input').value = btn.getAttribute('data-text');
      });
    });

    document.getElementById('search-input').addEventListener('input', renderCollection);
    document.getElementById('rarity-filter').addEventListener('change', renderCollection);

    window.addEventListener('DOMContentLoaded', () => {
      initStorage();
      renderCollection();
      if (myCards.length > 0) selectCard(myCards[0]);
      lucide.createIcons();
    });
  </script>
</body>
</html>
